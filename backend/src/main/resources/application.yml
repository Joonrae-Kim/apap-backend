server:
  port: 8080

spring:
  application:
    name: apap-backend
  datasource:
    url: jdbc:h2:file:./data/apap-local-db
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true

apap:
  ai-server-url: http://localhost:9000
  upload-dir: uploads
